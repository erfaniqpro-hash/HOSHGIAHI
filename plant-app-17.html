  :root{
    --bg:#f2f8ee;
    --leaf-1:#a9d8a4;
    --leaf-2:#7bc588;
    --leaf-3:#4f9d6e;
    --leaf-deep:#2f6b47;
    --cream:#fffdf6;
    --sun:#ffd76b;
    --ink:#2c3b2e;
    --muted:#6b7d6a;
    --radius:22px;
    --shadow: 0 8px 24px rgba(47,107,71,0.14);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    font-family:'AppFont', sans-serif;
    background:var(--bg);
    color:var(--ink);
    overflow-x:hidden;
  }
  .hidden{display:none !important;}

  /* organic paint-splash background */
  .bg-splash{
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background:
      radial-gradient(circle at 8% 12%, rgba(169,216,164,0.55) 0%, transparent 40%),
      radial-gradient(circle at 92% 18%, rgba(123,197,136,0.45) 0%, transparent 38%),
      radial-gradient(circle at 15% 85%, rgba(255,215,107,0.35) 0%, transparent 32%),
      radial-gradient(circle at 88% 82%, rgba(79,157,110,0.30) 0%, transparent 42%),
      radial-gradient(circle at 50% 50%, rgba(255,253,246,0.0) 0%, transparent 60%);
    filter: blur(6px);
  }

  .app{position:relative; z-index:1; max-width:520px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column;}

  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 18px; position:sticky; top:0; z-index:5;
    background:rgba(242,248,238,0.85); backdrop-filter:blur(8px);
    border-bottom:2px solid var(--leaf-1);
  }
  .brand{font-weight:800; font-size:20px; color:var(--leaf-deep); display:flex; gap:6px; align-items:center;}
  .xp-pill{
    background:var(--sun); color:#5a4300; font-weight:700; padding:6px 14px;
    border-radius:999px; font-size:13px; box-shadow:var(--shadow);
  }
  .xp-pill.small{padding:4px 10px; font-size:12px;}

  .view{flex:1; padding:16px 16px 100px; position:relative; z-index:1;}

  .card{
    background:var(--cream); border-radius:var(--radius); padding:20px;
    margin-bottom:16px; box-shadow:var(--shadow);
    border:3px solid var(--leaf-1);
    position:relative;
  }
  .card h2{margin:0 0 4px; color:var(--leaf-deep); font-size:20px;}
  .card h3, .card h4{color:var(--leaf-deep); margin:14px 0 8px;}
  .muted{color:var(--muted);}
  .small{font-size:12px;}
  .fine{font-size:12px; color:var(--muted); background:#fff7e0; border-radius:10px; padding:6px 10px; margin:8px 0;}
  .empty{color:var(--muted); text-align:center; padding:20px 0;}

  input, select{
    font-family:inherit; border:2px solid var(--leaf-1); border-radius:14px;
    padding:10px 14px; font-size:14px; background:#fff; color:var(--ink); flex:1;
    outline:none; transition:border-color .15s;
  }
  input:focus{border-color:var(--leaf-3);}

  .btn-primary{
    background:linear-gradient(135deg, var(--leaf-3), var(--leaf-deep));
    color:#fff; border:none; border-radius:14px; padding:10px 18px;
    font-weight:700; cursor:pointer; font-family:inherit; font-size:14px;
    box-shadow:0 4px 12px rgba(47,107,71,0.35);
    transition:transform .12s;
  }
  .btn-primary:hover{transform:translateY(-1px);}
  .btn-primary:active{transform:translateY(0);}

  .btn-mini{
    background:var(--leaf-1); border:none; border-radius:12px; padding:7px 12px;
    font-family:inherit; font-size:12px; font-weight:600; color:var(--leaf-deep);
    cursor:pointer;
  }
  .btn-mini.done{background:var(--leaf-3); color:#fff;}
  .btn-mini.later{background:var(--sun); color:#5a4300;}
  .btn-mini.report{background:#ffd6d6; color:#9c2b2b;}
  .chip-btn{
    background:#eaf6e6; border:2px solid var(--leaf-1); border-radius:14px;
    padding:9px 12px; font-family:inherit; cursor:pointer; font-size:13px;
  }

  .ai-input-row{display:flex; gap:8px; flex-wrap:wrap; margin-top:12px;}

const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => Array.from(root.querySelectorAll(sel));
const uid = (p = "id") => `${p}_${Math.random().toString(36).slice(2, 9)}`;

/* ---------------- PWA INSTALL ---------------- */
let deferredInstallPrompt = null;
let installPromptShownThisSession = false;
window.addEventListener("beforeinstallprompt", (e) => {
  e.preventDefault();
  deferredInstallPrompt = e;
});
window.addEventListener("appinstalled", () => {
  deferredInstallPrompt = null;
  try { localStorage.setItem("hooshGiah.installed", "1"); } catch (e) {}
});

function maybeShowInstallPrompt() {
  if (installPromptShownThisSession) return;
  // اگر قبلاً نصب شده یا در حالت standalone باز شده، دیگر نپرس
  const isStandalone = window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
  let alreadyInstalled = false;
  try { alreadyInstalled = localStorage.getItem("hooshGiah.installed") === "1"; } catch (e) {}
  if (isStandalone || alreadyInstalled) return;

  installPromptShownThisSession = true;
  // کمی صبر می‌کنیم تا رویداد beforeinstallprompt مرورگر برسد (در صورت پشتیبانی)
  setTimeout(() => {
    const sheet = $("#installPrompt");
    if (!sheet) return;
    sheet.classList.remove("hidden");
  }, 900);
}

function wireInstallPrompt() {
  const sheet = $("#installPrompt");
  if (!sheet) return;
  $("#btnInstallYes").onclick = async () => {
    if (deferredInstallPrompt) {
      deferredInstallPrompt.prompt();
      const choice = await deferredInstallPrompt.userChoice.catch(() => null);
      deferredInstallPrompt = null;
      if (choice && choice.outcome === "accepted") {
        toast("🎉 در حال نصب برنامه...");
      } else {
        toast("می‌توانید بعداً از منوی مرورگر نصب کنید");

/* ---------------- PERSISTENCE (localStorage) ----------------
   بدون این بخش، با هر رفرش صفحه گیاهان، یادآورها، امتیاز XP و ورود کاربر
   پاک می‌شد و یادآورهای زمان‌بندی‌شده هرگز فرصت سررسید شدن پیدا نمی‌کردند. */
const STORAGE_KEY = "hooshGiah.state.v1";

function persist() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
      user: State.user,
      myPlants: State.myPlants,
      notifications: State.notifications,
      xp: State.xp,
      aiPlants: State.db.plants.filter((p) => p.id.startsWith("ai_")),
    }));
  } catch (e) { /* حالت خصوصی مرورگر یا ظرفیت پر — نادیده گرفته می‌شود */ }
}

function loadPersisted() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    const saved = JSON.parse(raw);
    if (saved.user) State.user = saved.user;
    if (Array.isArray(saved.myPlants)) State.myPlants = saved.myPlants;
    if (Array.isArray(saved.notifications)) State.notifications = saved.notifications;
    if (typeof saved.xp === "number") State.xp = saved.xp;
    if (Array.isArray(saved.aiPlants)) {
      saved.aiPlants.forEach((p) => {
        if (!State.db.plants.find((x) => x.id === p.id)) State.db.plants.push(p);
      });
    }
  } catch (e) { /* داده خراب — نادیده گرفته می‌شود */ }
}

/* ---------------- SYSTEM / PUSH NOTIFICATIONS ---------------- */
const NotifEngine = {
  supported: "Notification" in window,
  swReady: null, // Promise<ServiceWorkerRegistration> | null
  get permission() { return this.supported ? Notification.permission : "unsupported"; },
  async init() {
    if (!("serviceWorker" in navigator)) {
      console.warn("این مرورگر از Service Worker پشتیبانی نمی‌کند — اعلان‌های سیستمی واقعی کار نخواهند کرد.");
      return;
    }
    try {
      // از URL مطلق نسبت به همین صفحه استفاده می‌کنیم تا مسیر همیشه درست حل شود
      const swUrl = new URL("sw.js", document.baseURI).href;
      const reg = await navigator.serviceWorker.register(swUrl);
      // منتظر می‌مانیم که واقعاً فعال (active) شود، نه فقط ثبت شود
      if (reg.installing) {
        await new Promise((resolve) => {
          reg.installing.addEventListener("statechange", function onChange(e) {
            if (e.target.state === "activated" || e.target.state === "redundant") {
              e.target.removeEventListener("statechange", onChange);
              resolve();
            }
          });
        });
      }
      await navigator.serviceWorker.ready;
      this.swReady = Promise.resolve(reg);
    } catch (e) {
      console.warn("SW registration failed — سرویس‌ورکر ثبت نشد:", e);
      this.swReady = null;
    }
  },
  async requestPermission() {
    if (!this.supported) { toast("این مرورگر از اعلان‌ها پشتیبانی نمی‌کند"); return "unsupported"; }
    if (Notification.permission === "granted") return "granted";
    const res = await Notification.requestPermission();
    if (res === "granted") toast("🔔 اعلان‌ها فعال شدند");
    else if (res === "denied") toast("اعلان‌ها مسدود شدند — از تنظیمات مرورگر می‌توانید تغییر دهید");
    if (State.view === "notifications") renderNotifications();
    return res;
  },
  async fire(title, body, tag) {
    if (!(this.supported && Notification.permission === "granted")) {
      toast(`${title} — ${body}`);
      return;
    }
    // اگر سرویس‌ورکر هنوز آماده نیست، یک‌بار دیگر تلاش می‌کنیم آن را آماده کنیم
    if (!this.swReady && "serviceWorker" in navigator) {
      try {
        const existing = await navigator.serviceWorker.getRegistration();
        if (existing) this.swReady = Promise.resolve(existing);
        else await this.init();
      } catch (e) { /* ignore */ }
    }
    try {
      const reg = this.swReady ? (await this.swReady) : (await navigator.serviceWorker.ready.catch(() => null));
      if (reg && reg.showNotification) {
        // نوتیفیکیشن واقعی سیستم — روی گوشی در نوار اعلان ظاهر می‌شود، نه داخل برنامه
        await reg.showNotification(title, {
          body,
          tag,
          renotify: !!tag,
          icon: "./icons/icon-192.png",
          badge: "./icons/icon-192.png",
          vibrate: [120, 60, 120],
          dir: "rtl",
          lang: "fa",
        });
        return;
      }
    } catch (e) {
      console.warn("SW showNotification failed:", e);
    }
    // پشتیبان: فقط برای مرورگرهای دسکتاپ که SW ندارند اما از new Notification پشتیبانی می‌کنند
    try {
      const n = new Notification(title, { body, icon: "./icons/icon-192.png", tag });
      n.onclick = () => { window.focus(); n.close(); };
    } catch (e) {
      toast(`⚠️ اعلان سیستم ارسال نشد — ${title}: ${body}`);
    }
  }
};

let notifAskedThisSession = false;
function maybeAskNotificationPermission() {
  if (notifAskedThisSession) return;
  if (!NotifEngine.supported) return;
  if (Notification.permission !== "default") return; // قبلاً تصمیم‌گیری شده
  notifAskedThisSession = true;
  // کمی بعد از باز شدن برنامه بپرس، تا با پرسش نصب برنامه تداخل نداشته باشد
  setTimeout(() => { NotifEngine.requestPermission(); }, 2200);
}

function checkDueNotifications() {
  const now = Date.now();
  let fired = false;
  State.notifications.forEach((n) => {
    if (!n.done && !n.notified && n.dueAt <= now) {
      n.notified = true;
      fired = true;
      const label = CARE_LABELS[n.type]?.label || n.type;
      const icon = CARE_LABELS[n.type]?.icon || "🔔";
      NotifEngine.fire(`${icon} یادآور ${label}`, `وقت مراقبت از «${n.plantName}» رسیده!`, n.id);
    }
  });
  if (fired) {
    persist();
    if (State.view === "notifications") renderNotifications();
  }
}

async function aiVisionIdentify(imageDataUrl) {
  const systemPrompt = [
    "تو یک متخصص گیاه‌شناسی و کشاورزی هستی که تصویر یک گیاه، میوه، سبزی یا درخت را می‌بینی و باید آن را دقیق شناسایی کنی.",
    "به‌دقت به شکل برگ، رنگ، بافت پوست، شکل میوه یا گل در تصویر نگاه کن و نوع دقیق را تشخیص بده — هرگز حدس تصادفی نزن و هرگز صرفاً یک گیاه رایج و متداول (مثل پوتوس) را به‌عنوان پاسخ پیش‌فرض ننویس مگر اینکه واقعاً همان باشد.",
    "اگر تصویر یک میوه است (مثل انار، سیب، پرتقال)، نام همان میوه و درختش را بنویس، نه یک گیاه آپارتمانی نامرتبط.",
    "اگر مطمئن نیستی یا تصویر واضح نیست، این را با عدد confidence پایین (زیر 50) نشان بده، نه با انتخاب یک گیاه دلخواه.",
    "فقط و فقط یک شیء JSON خام برگردان، بدون ```json و بدون هیچ توضیح اضافه، دقیقاً با این کلیدها:",
    '{"name_fa": string (نام فارسی دقیق گیاه/میوه شناسایی‌شده), "latin": string (نام علمی لاتین), "confidence": number (0 تا 100), "watering": string, "fertilizing": string, "sunlight": string, "soil": string, "temperature": string, "humidity": string, "diseases": string (چند مورد، جدا شده با ویرگول فارسی «،»), "seasonal": string}',
    "تمام مقادیر متنی باید به زبان فارسی باشند."
  ].join("\n");

  const res = await fetch(`${AI_CONFIG.baseUrl}/chat/completions`, {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "Authorization": `Bearer ${AI_CONFIG.apiKey}`,
    },
    body: JSON.stringify({
      model: AI_CONFIG.visionModel,
      temperature: 0.1,
      max_tokens: 900,
      messages: [
        { role: "system", content: systemPrompt },
        {
          role: "user",
          content: [
            { type: "text", text: "این تصویر چه گیاه یا میوه‌ای است؟ دقیقاً طبق فرمت JSON خواسته‌شده و فقط بر اساس چیزی که واقعاً در عکس می‌بینی پاسخ بده." },
            { type: "image_url", image_url: { url: imageDataUrl, detail: "high" } },
          ],
        },
      ],
    }),
  });
  if (!res.ok) {
    const errText = await res.text().catch(() => "");
    throw new Error(`Vision request failed: ${res.status} ${errText.slice(0, 200)}`);
  }
  const data = await res.json();
  let raw = (data.choices?.[0]?.message?.content || "").trim();
  if (!raw) throw new Error("Empty response from vision model");
  // مدل گاهی JSON را داخل ```json ... ``` می‌گذارد یا متن اضافه قبل/بعدش می‌نویسد —
  // اولین بلوک { ... } معتبر را استخراج می‌کنیم
  raw = raw.replace(/^```json\s*/i, "").replace(/^```\s*/i, "").replace(/```\s*$/i, "").trim();
  const firstBrace = raw.indexOf("{");
  const lastBrace = raw.lastIndexOf("}");
  if (firstBrace === -1 || lastBrace === -1) throw new Error("No JSON object found in vision response: " + raw.slice(0, 200));
  const jsonSlice = raw.slice(firstBrace, lastBrace + 1);
  let parsed;
  try {
    parsed = JSON.parse(jsonSlice);
  } catch (e) {
    throw new Error("Failed to parse vision JSON: " + jsonSlice.slice(0, 200));
  }
  return parsed;
}

function fileToDataUrl(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// عکس‌های گوشی معمولاً خیلی بزرگ هستند (چند مگابایت) — قبل از ارسال به API
// آن را به حداکثر ۱۲۸۰ پیکسل کوچک می‌کنیم تا هم سریع‌تر باشد و هم رد نشود
function downscaleImage(dataUrl, maxSize = 1280) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      let { width, height } = img;
      if (width <= maxSize && height <= maxSize) { resolve(dataUrl); return; }
      const scale = maxSize / Math.max(width, height);
      width = Math.round(width * scale);
      height = Math.round(height * scale);
      const canvas = document.createElement("canvas");
      canvas.width = width; canvas.height = height;
      const ctx = canvas.getContext("2d");
      ctx.drawImage(img, 0, 0, width, height);
      resolve(canvas.toDataURL("image/jpeg", 0.85));
    };
    img.onerror = reject;
    img.src = dataUrl;
  });
}

function scoreMatch(text, plant) {
  const t = (text || "").toLowerCase();
  if (!t) return 0;
  let hits = 0;
  plant.keywords.forEach((k) => { if (t.includes(k.toLowerCase())) hits++; });
  if (hits === 0) return 0;
  return Math.min(97, plant.confidenceBase - (plant.keywords.length - hits) * 8);
}

function runIdentify({ mode, text }) {
  const query = mode === "image" ? "" : (text || "").trim();
  const box = $("#aiResult");

  if (!query) { toast("لطفاً توضیح یا نام گیاه رو بنویس"); return; }

  let best = null, bestScore = 0;
  State.db.plants.forEach((p) => {
    const s = scoreMatch(query, p);
    if (s > bestScore) { bestScore = s; best = p; }
  });

  if (!best || bestScore < 60) {
    box.innerHTML = `
      <div class="ai-card low-confidence">
        <p>🤔 مطمئن نیستم (اطمینان ${bestScore}٪). لطفاً اطلاعات بیشتری بده:</p>
        <ul>
          <li>عکس نزدیک از برگ، ساقه و گل</li>
          <li>رنگ و شکل برگ‌ها</li>
          <li>محیط نگهداری (نور، دما)</li>
        </ul>
        <div class="ai-input-row">
          <input id="moreInfo" placeholder="مثلاً: برگ‌های سبز تیره، ساقه ضخیم، نور کم..." />
          <button class="btn-primary" id="btnMore">ارسال اطلاعات بیشتر</button>
        </div>
      </div>`;
    $("#btnMore").onclick = () => runIdentify({ mode: "text", text: query + " " + $("#moreInfo").value });
    return;
  }
  renderIdentifyResult(best, bestScore, false);
}

async function runChat() {
  const input = $("#chatText");
  const text = input.value.trim();
  if (!text) return;
  const log = $("#chatLog");
  log.insertAdjacentHTML("beforeend", `<div class="msg me">${escapeHtml(text)}</div>`);
  input.value = "";
  log.scrollTop = log.scrollHeight;
  log.insertAdjacentHTML("beforeend", `<div class="msg ai" id="chatPending">در حال فکر کردن...</div>`);
  log.scrollTop = log.scrollHeight;

  try {
    const reply = await aiChatCompletion([
      { role: "system", content: "تو یک دستیار متخصص نگهداری گیاهان خانگی هستی. همیشه به زبان فارسی، کوتاه، دوستانه و کاربردی پاسخ بده." },
      { role: "user", content: text },
    ]);
    const pending = $("#chatPending");
    if (pending) pending.remove();
    log.insertAdjacentHTML("beforeend", `<div class="msg ai">${escapeHtml(reply || mockPlantAnswer(text))}</div>`);
  } catch (e) {
    console.warn("AI chat failed, falling back to local knowledge base:", e);
    const pending = $("#chatPending");
    if (pending) pending.remove();
    log.insertAdjacentHTML("beforeend", `<div class="msg ai">${mockPlantAnswer(text)}</div>`);
  }
  log.scrollTop = log.scrollHeight;
}

// دستیار محلی مبتنی بر پایگاه‌دانش گیاهان — بدون نیاز به کلید API یا سرور خارجی،
// همیشه در دسترس و امن (هیچ داده‌ای به بیرون ارسال نمی‌شود).
function mockPlantAnswer(text) {
  const t = text.toLowerCase();
  const hit = State.db.plants.find((p) => p.keywords.some((k) => t.includes(k.toLowerCase())));

  if (hit) {
    const c = hit.care;
    if (t.includes("آبیاری") || t.includes("آب")) return `💧 ${hit.name}: ${c.watering}`;
    if (t.includes("نور") || t.includes("آفتاب")) return `☀️ ${hit.name}: ${c.sunlight}`;
    if (t.includes("کود")) return `🧪 ${hit.name}: ${c.fertilizing}`;
    if (t.includes("خاک")) return `🪴 ${hit.name}: ${c.soil}`;
    if (t.includes("بیماری") || t.includes("مریض") || t.includes("لکه")) return `🩺 مشکلات رایج ${hit.name}: ${c.diseases.join("، ")}`;
    if (t.includes("زمستان") || t.includes("فصل")) return `❄️ نکته فصلی ${hit.name}: ${c.seasonal}`;
    return `درباره ${hit.name}: ${c.watering} همچنین ${c.sunlight} نیاز داره. برای جزئیات بیشتر بپرس (آبیاری، نور، کود، خاک، بیماری).`;
  }

  if (t.includes("زرد")) return "🟡 زرد شدن برگ معمولاً به‌خاطر آبیاری زیاد، نور نامناسب یا کمبود مواد غذایی است — اول رطوبت خاک رو چک کن.";
  if (t.includes("قهوه") || t.includes("سوخت")) return "🟤 قهوه‌ای یا سوختگی لبه برگ معمولاً از نور مستقیم شدید، هوای خشک یا کمبود آب میاد.";
  if (t.includes("آبیاری")) return "💧 بیشتر گیاهان آپارتمانی وقتی چند سانتی‌متر بالای خاک خشک شد نیاز به آب دارن. بهتره قبل از آبیاری با انگشت خاک رو چک کنی.";
  if (t.includes("پوسیدگی") || t.includes("ریشه")) return "🦠 پوسیدگی ریشه معمولاً از آبیاری زیاد و زهکش ضعیف گلدون میاد — گلدون رو با خاک تازه و زهکش خوب عوض کن.";
  if (t.includes("حشره") || t.includes("آفت") || t.includes("شپشک")) return "🐛 برای آفت‌های رایج مثل شپشک آرد، برگ‌ها رو با پارچه مرطوب یا محلول آب‌وصابون تمیز کن و گیاه رو موقتاً از بقیه جدا نگه دار.";

  return "می‌تونی اسم گیاهت رو بگی یا دقیق‌تر بپرسی (مثلاً آبیاری، نور، کود، خاک یا بیماری) تا راهنمایی دقیق‌تری بدم 🌱";
}

/* ---------------- MY PLANTS ---------------- */
function addMyPlant(plant) {
  // اگر این گیاه از هوش مصنوعی اومده و در پایگاه‌داده محلی نیست، اضافه‌اش می‌کنیم
  // تا بعداً در «گیاهان من» بشه جزئیاتش رو پیدا کرد
  if (!State.db.plants.find((p) => p.id === plant.id)) {
    State.db.plants.push(plant);
  }
  const mp = {
    uid: uid("mp"),
    plantId: plant.id,
    nickname: plant.name,
    folder: "",
    isPublic: false,
    addedAt: Date.now(),
  };
  State.myPlants.push(mp);
  scheduleNotifications(mp, plant);
  persist();
  toast(`${plant.name} به گیاهان من اضافه شد 🌱`);
  goto("myplants");
}

function scheduleNotifications(mp, plant) {
  (plant.care.schedule || []).forEach((rule) => {
    const [type, days] = rule.split(":");
    State.notifications.push({
      id: uid("notif"),
      plantUid: mp.uid,
      plantName: mp.nickname,
      type,
      dueAt: Date.now() + Number(days) * 24 * 3600e3,
      done: false,
      notified: false,
    });
  });
}

  el.innerHTML = `
    <section class="card">
      <h2>🪴 گیاهان من</h2>

          }).join("")}
        </div>

  });
}

function renderNotifications() {
  const el = $("#view");
  const pending = State.notifications.filter((n) => !n.done).sort((a, b) => a.dueAt - b.dueAt);
  const done = State.notifications.filter((n) => n.done);
  const perm = NotifEngine.permission;
  const isStandalone = window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
  const isIOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
  const installHint = (!isStandalone && isIOS)
    ? `<div class="fine">📲 برای دریافت اعلان‌های واقعی روی آیفون، باید این سایت را از منوی Safari با گزینه «Add to Home Screen» نصب کنی و از همون آیکون روی صفحه اصلی بازش کنی.</div>`
    : (!isStandalone ? `<div class="fine">📲 برای اطمینان از دریافت اعلان‌ها حتی زمانی که تب بسته است، پیشنهاد می‌شود برنامه را نصب کنی (منوی مرورگر → Add to Home screen / Install app).</div>` : "");
  const permBanner = perm === "granted"
    ? `<div class="fine">🔔 اعلان‌های سیستم فعال است — وقتی یادآوری سررسید شود، پیام دریافت می‌کنی.</div>${installHint}`
    : perm === "denied"
      ? `<div class="fine">⚠️ اعلان‌ها در مرورگر مسدود شده‌اند. برای فعال‌سازی از تنظیمات سایت در مرورگر اجازه بده.</div>`
      : `<div class="ai-input-row"><button class="btn-primary" id="btnEnableNotif">🔔 فعال‌سازی اعلان‌ها</button></div>${installHint}`;
  el.innerHTML = `
    <section class="card">
      <h2>🔔 یادآورهای مراقبت</h2>
      ${permBanner}
      ${pending.length === 0 ? `<p class="empty">یادآور فعالی نداری 🌿</p>` : ""}
      <div class="notif-list">
        ${pending.map((n) => `
          <div class="notif-row">
            <span>${CARE_LABELS[n.type]?.icon || "🔔"} <b>${CARE_LABELS[n.type]?.label || n.type}</b> — ${n.plantName}</span>
            <span class="muted small">${new Date(n.dueAt).toLocaleDateString("fa-IR")}</span>
            <div class="notif-actions">
              <button class="btn-mini done" data-id="${n.id}">✅ انجام شد</button>
              <button class="btn-mini later" data-id="${n.id}">⏰ بعداً</button>
            </div>
          </div>`).join("")}
      </div>
      ${done.length ? `<h4>انجام‌شده‌ها</h4><p class="muted small">${done.length} یادآور تکمیل شده</p>` : ""}
      <button class="btn-mini" id="btnTestNotif">🧪 ارسال یک پیام آزمایشی</button>
    </section>
  `;
  $$(".btn-mini.done").forEach((b) => b.onclick = () => completeNotification(b.dataset.id));
  $$(".btn-mini.later").forEach((b) => b.onclick = () => {
    const n = State.notifications.find((x) => x.id === b.dataset.id);
    n.dueAt += 24 * 3600e3;
    persist();
    toast("⏰ یادآور به فردا موکول شد");
    renderNotifications();
  });

  $("#btnTestNotif").onclick = () => NotifEngine.fire("🌱 هوش گیاهی", "این یک پیام آزمایشی است — اعلان‌ها درست کار می‌کنند!", "test");

function completeNotification(id) {
  const n = State.notifications.find((x) => x.id === id);
  if (!n) return;
  n.done = true;
  gainXp(15);
  persist();
  celebrate();
  renderNotifications();
}

function celebrate() {
  const c = $("#celebration");
  c.innerHTML = `<div class="confetti-box"><div class="confetti-emoji">🎉🌱🎉</div><p>آفرین! داری عالی از گیاهانت مراقبت می‌کنی 🌱</p></div>`;
  c.classList.remove("hidden");
  setTimeout(() => c.classList.add("hidden"), 7500);
}

function gainXp(n) {
  State.xp += n;
  $("#xpVal") && ($("#xpVal").textContent = State.xp);
  updateTrustLevel();
}

function updateTrustLevel() {
  const levels = [...State.db.trustLevels].sort((a, b) => b.minXp - a.minXp);
  const lvl = levels.find((l) => State.xp >= l.minXp);
  if (lvl && State.user) State.user.trust = lvl.id;
}

  return `${Math.floor(min / 60)} ساعت پیش`;
}

}

/* ---------------- LEADERBOARD ---------------- */
function renderLeaderboard() {
  const el = $("#view");
  const users = [...State.db.users].sort((a, b) => b.xp - a.xp);
  el.innerHTML = `
    <section class="card">
      <h2>🏆 برترین‌های ایران 🇮🇷</h2>
      <div class="leader-list">
        ${users.map((u, i) => `
          <div class="leader-row">
            <span class="rank">${i + 1}</span>
            <span>${u.avatar}</span>
            <div><b>${u.name}</b><br><span class="muted small">${u.city}</span></div>
            <span class="xp-pill small">⭐ ${u.xp}</span>
            <button class="btn-mini" data-name="${u.name}">💬 گفتگو</button>
          </div>
        `).join("")}
      </div>
    </section>
  `;
  $$(".leader-row .btn-mini").forEach((b) => b.onclick = () => toast(`درخواست گفتگو با ${b.dataset.name} ارسال شد`));
}

/* ---------------- PROFILE ---------------- */
function renderProfile() {
  const el = $("#view");
  const u = State.user;
  const lvl = State.db.trustLevels.find((t) => t.id === u.trust) || State.db.trustLevels[0];
  el.innerHTML = `
    <section class="card profile-card">
      <div class="profile-avatar">${u.avatar}</div>
      <h2>${u.name} ${u.surname}</h2>
      <p class="muted">${u.city}، ${u.country}</p>
      <div class="trust-line">${lvl.icon} ${lvl.label}</div>
      <div class="xp-pill">⭐ ${State.xp} XP</div>
      <p class="muted small">${State.myPlants.length} گیاه ثبت‌شده · ${State.notifications.filter(n=>n.done).length} مراقبت انجام‌شده</p>
      <button class="btn-mini" id="btnAdmin">🔐 ورود ادمین</button>
      <button class="btn-mini report" id="btnLogout">🚪 خروج از حساب</button>
    </section>
  `;
  $("#btnAdmin").onclick = () => {
    const code = prompt("کد ادمین را وارد کنید:");
    if (code === "0000") goto("admin"); else if (code !== null) toast("کد نادرست است ❌");
  };
  $("#btnLogout").onclick = () => {
    if (!confirm("از حساب خارج شوی؟ اطلاعات گیاهان و یادآورهای این دستگاه حذف می‌شود.")) return;
    localStorage.removeItem(STORAGE_KEY);
    State.user = null;
    State.myPlants = [];
    State.notifications = [];
    State.xp = 0;
    $("#app").classList.add("hidden");
    $("#authScreen").classList.remove("hidden");
    goto("auth");
  };
}

/* ---------------- ADMIN ---------------- */
const ADMIN_SECTIONS = ["overview", "posts", "market", "users", "notif"];
State.adminTab = "overview";

function renderAdmin() {
  const el = $("#view");
  const tab = State.adminTab || "overview";
  el.innerHTML = `
    <section class="card">
      <h2>🔐 پنل ادمین</h2>
      <p class="muted">مدیریت محتوا، بازار و کاربران</p>
      <div class="admin-tabs">
        <button class="admin-tab ${tab === "overview" ? "active" : ""}" data-tab="overview">نمای کلی</button>
        <button class="admin-tab ${tab === "posts" ? "active" : ""}" data-tab="posts">پست‌های انجمن</button>
        <button class="admin-tab ${tab === "market" ? "active" : ""}" data-tab="market">آگهی‌های بازار</button>
        <button class="admin-tab ${tab === "users" ? "active" : ""}" data-tab="users">کاربران</button>
        <button class="admin-tab ${tab === "notif" ? "active" : ""}" data-tab="notif">اعلان‌ها</button>
      </div>
      <div id="adminBody"></div>
      <button class="btn-primary" id="btnBack" style="margin-top:14px;">بازگشت به پروفایل</button>
    </section>
  `;
  $("#btnBack").onclick = () => goto("profile");
  $$(".admin-tab").forEach((b) => b.onclick = () => { State.adminTab = b.dataset.tab; renderAdmin(); });
  renderAdminBody(tab);
}

function renderAdminBody(tab) {
  const body = $("#adminBody");
  if (tab === "overview") {
    const isHttps = location.protocol === "https:";
    const isLocalhost = /^(localhost|127\.0\.0\.1)$/.test(location.hostname);
    const isFileProtocol = location.protocol === "file:";
    const hasSW = "serviceWorker" in navigator;
    const swActive = !!(navigator.serviceWorker && navigator.serviceWorker.controller);
    const isStandalone = window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
    const notifPerm = NotifEngine.permission;
    const canInstall = !!deferredInstallPrompt;

    const statusRow = (ok, label, detail) => `
      <div class="admin-row"><span>${ok ? "✅" : "⛔"} ${label}</span><b class="muted small">${detail}</b></div>`;

    body.innerHTML = `
      <div class="admin-row"><span>💬 کل پست‌های انجمن</span><b>${State.posts.length}</b></div>
      <div class="admin-row"><span>🛒 کل آگهی‌های بازار</span><b>${State.db.marketplace.length}</b></div>
      <div class="admin-row"><span>👥 کل کاربران</span><b>${State.db.users.length}</b></div>
      <div class="admin-row"><span>🚩 پست‌های گزارش‌شده</span><b>${(State.posts.filter(p=>p.reported)||[]).length}</b></div>

      <h4>📲 وضعیت فنی نصب و اعلان‌ها (روی همین دستگاه)</h4>
      ${isFileProtocol ? `<div class="fine">⚠️ این صفحه با پروتکل file:// باز شده — روی این حالت، هیچ مرورگری اجازه نصب PWA یا نوتیفیکیشن واقعی نمی‌دهد. باید فایل‌ها را روی یک دامنه HTTPS (یا localhost برای تست) میزبانی کنی.</div>` : ""}
      ${statusRow(isHttps || isLocalhost, "HTTPS / localhost", isHttps ? "برقرار" : isLocalhost ? "localhost (برای تست کافیست)" : "برقرار نیست")}
      ${statusRow(hasSW, "پشتیبانی مرورگر از Service Worker", hasSW ? "دارد" : "ندارد")}
      ${statusRow(swActive, "فعال بودن Service Worker این صفحه", swActive ? "فعال" : "هنوز فعال نشده")}
      ${statusRow(isStandalone, "حالت اجرا", isStandalone ? "نصب‌شده (Standalone)" : "در تب مرورگر")}
      ${statusRow(notifPerm === "granted", "مجوز اعلان سیستم", notifPerm === "granted" ? "فعال" : notifPerm === "denied" ? "مسدود" : "هنوز پرسیده نشده")}
      ${statusRow(canInstall, "دکمه نصب مرورگر آماده است", canInstall ? "آماده (رویداد beforeinstallprompt دریافت شد)" : "هنوز دریافت نشده")}

      <h4>🔔 تست نوتیفیکیشن</h4>
      <p class="muted small">یک اعلان سیستمی واقعی بفرست تا مطمئن بشی روی نوار بالای گوشی ظاهر می‌شه.</p>
      <div class="admin-actions">
        <button class="btn-primary" id="btnAdminNotifTest">📣 ارسال نوتیفیکیشن آزمایشی</button>
      </div>
      <p class="fine">🧠 دستیار هوش مصنوعی متصل به سرویس هوش مصنوعی خارجی (GapGPT) است. در صورت قطع ارتباط، به‌صورت خودکار از پایگاه‌دانش محلی استفاده می‌شود.</p>
    `;
    $("#btnAdminNotifTest").onclick = async () => {
      let perm = NotifEngine.permission;
      if (perm !== "granted" && perm !== "denied") perm = await NotifEngine.requestPermission();
      if (perm === "granted") {
        NotifEngine.fire("📣 پیام از پنل مدیریت", "این یک نوتیفیکیشن آزمایشی ارسال‌شده توسط ادمین است.", "admin-test-" + Date.now());
      } else if (perm === "denied") {
        toast("⚠️ اعلان‌ها مسدود شده‌اند — از تنظیمات مرورگر اجازه بده");
      }
    };
  }

  else if (tab === "posts") {
    body.innerHTML = `
      <p class="muted small">${State.posts.length} پست — هر پست را می‌توانی حذف کنی.</p>
      <div class="admin-list">
        ${State.posts.length === 0 ? `<p class="empty">پستی برای نمایش نیست</p>` : State.posts.map((p) => `
          <div class="admin-item">
            <span>${p.author.avatar || "🙂"}</span>
            <div class="admin-item-info">
              <b>${escapeHtml(p.author.name)}</b>
              <p>${escapeHtml(p.text)}</p>
            </div>
            <div class="admin-item-actions">
              <button class="btn-mini danger" data-id="${p.id}">🗑️ حذف</button>
            </div>
          </div>
        `).join("")}
      </div>
    `;
    $$(".admin-item-actions .btn-mini.danger").forEach((b) => b.onclick = () => {
      if (!confirm("این پست حذف شود؟")) return;
      State.posts = State.posts.filter((p) => p.id !== b.dataset.id);
      toast("🗑️ پست حذف شد");
      renderAdminBody("posts");
    });
  }

  else if (tab === "market") {
    body.innerHTML = `
      <p class="muted small">${State.db.marketplace.length} آگهی — آگهی‌های نامرتبط یا نامناسب را حذف کن.</p>
      <div class="admin-list">
        ${State.db.marketplace.length === 0 ? `<p class="empty">آگهی‌ای برای نمایش نیست</p>` : State.db.marketplace.map((m) => `
          <div class="admin-item">
            <span>${{ plant: "🌱", fertilizer: "🧪", tool: "🛠️", accessory: "🪴" }[m.category] || "🛒"}</span>
            <div class="admin-item-info">
              <b>${escapeHtml(m.title)}</b>
              <p>${m.price.toLocaleString("fa-IR")} تومان · ⭐ ${m.rating}</p>
            </div>
            <div class="admin-item-actions">
              <button class="btn-mini danger" data-id="${m.id}">🗑️ حذف</button>
            </div>
          </div>
        `).join("")}
      </div>
    `;
    $$(".admin-item-actions .btn-mini.danger").forEach((b) => b.onclick = () => {
      if (!confirm("این آگهی حذف شود؟")) return;
      State.db.marketplace = State.db.marketplace.filter((m) => m.id !== b.dataset.id);
      toast("🗑️ آگهی حذف شد");
      renderAdminBody("market");
    });
  }

  else if (tab === "users") {
    body.innerHTML = `
      <p class="muted small">${State.db.users.length} کاربر</p>
      <div class="admin-list">
        ${State.db.users.map((u) => `
          <div class="admin-item">
            <span>${u.avatar}</span>
            <div class="admin-item-info">
              <b>${escapeHtml(u.name)}</b>
              <p>${escapeHtml(u.city)} · ⭐ ${u.xp} XP ${u.blocked ? "· 🚫 مسدود" : ""}</p>
            </div>
            <div class="admin-item-actions">
              <button class="btn-mini ${u.blocked ? "" : "danger"}" data-id="${u.id}">${u.blocked ? "✅ رفع مسدودی" : "⛔ مسدود"}</button>
            </div>
          </div>
        `).join("")}
      </div>
    `;
    $$(".admin-item-actions .btn-mini").forEach((b) => b.onclick = () => {
      const u = State.db.users.find((x) => x.id === b.dataset.id);
      u.blocked = !u.blocked;
      toast(u.blocked ? "⛔ کاربر مسدود شد" : "✅ مسدودیت کاربر برداشته شد");
      renderAdminBody("users");
    });
  }

  else if (tab === "notif") {
    const perm = NotifEngine.permission;
    body.innerHTML = `
      <p class="muted small">وضعیت اعلان‌ها روی این دستگاه: <b>${perm === "granted" ? "فعال ✅" : perm === "denied" ? "مسدود ⛔" : "هنوز تصمیم‌گیری نشده"}</b></p>
      <p class="muted small">${State.notifications.filter(n=>!n.done).length} یادآور فعال در کل برنامه (این دستگاه)</p>
      <div class="admin-actions">
        <button class="btn-primary" id="btnBroadcast">📣 ارسال اعلان به همه (نمایشی)</button>
      </div>
      <p class="fine">در نسخه واقعی، این دکمه یک Push Notification از طریق سرور برای همهٔ کاربران ثبت‌شده ارسال می‌کند. در این نسخه دمو (بدون بک‌اند)، فقط روی همین دستگاه نمایش داده می‌شود.</p>
    `;
    $("#btnBroadcast").onclick = async () => {
      let p = NotifEngine.permission;
      if (p !== "granted" && p !== "denied") p = await NotifEngine.requestPermission();
      if (p === "granted") NotifEngine.fire("📣 اطلاعیه همگانی", "این یک پیام آزمایشی برای همه کاربران است.", "broadcast-" + Date.now());
      else toast("⚠️ برای تست، ابتدا اعلان‌ها را در این دستگاه فعال کن");
    };
  }
}

document.addEventListener("DOMContentLoaded", boot);

</script>
</body>
</html>
